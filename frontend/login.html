<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Booyah Arena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>

<main class="container">
  <div class="auth-card">
    <h1 class="fs-3 mb-1">Welcome back</h1>
    <p class="text-muted-ff">Login to manage your squad and register for tournaments.</p>
    <p id="authOk" class="ok-msg" role="status"></p>
    <form id="loginForm" novalidate>
      <div class="mb-3"><label class="form-label" for="lEmail">Email</label><input type="email" class="form-control" id="lEmail" required autocomplete="email"></div>
      <div class="mb-3"><label class="form-label" for="lPass">Password</label><input type="password" class="form-control" id="lPass" required minlength="6" autocomplete="current-password"></div>
      <button class="btn-fire w-100" type="submit">Login</button>
    </form>
    <p id="authMsg" class="mt-3 mb-0" style="color:#ff8d8d" role="alert"></p>
    <p class="mt-3 mb-0 text-muted-ff">New to Booyah Arena? <a href="register.html">Create an account first</a></p>
    <p class="mt-2 mb-0 field-hint">Demo admin: admin@booyah.com / admin123</p>
  </div>
</main>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
