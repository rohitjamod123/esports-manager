<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Create your Booyah Arena captain account.">
<title>Create account | Booyah Arena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>

<main class="container">
  <div class="auth-card">
    <h1 class="fs-3 mb-1">Create your account</h1>
    <p class="text-muted-ff">Sign up first, then login to register your squad in tournaments.</p>
    <form id="registerForm" novalidate>
      <div class="mb-3"><label class="form-label" for="rName">Full name</label><input class="form-control" id="rName" required minlength="2" autocomplete="name"></div>
      <div class="mb-3"><label class="form-label" for="rEmail">Email</label><input type="email" class="form-control" id="rEmail" required autocomplete="email"></div>
      <div class="mb-3"><label class="form-label" for="rPass">Password</label><input type="password" class="form-control" id="rPass" required minlength="6" autocomplete="new-password"><div class="field-hint mt-1">At least 6 characters.</div></div>
      <div class="mb-3"><label class="form-label" for="rPass2">Confirm password</label><input type="password" class="form-control" id="rPass2" required minlength="6" autocomplete="new-password"></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="rAgree" required><label class="form-check-label" for="rAgree">I agree to the <a href="legal.html#terms">Terms of Use</a> and <a href="legal.html#privacy">Privacy Policy</a></label></div>
      <button class="btn-fire w-100" type="submit">Create account</button>
    </form>
    <p id="regMsg" class="mt-3 mb-0" style="color:#ff8d8d" role="alert"></p>
    <p class="mt-3 mb-0 text-muted-ff">Already have an account? <a href="login.html">Login</a></p>
  </div>
</main>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/register.js"></script>
</body>
</html>
