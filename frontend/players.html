<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players | Booyah Arena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>

<header class="page-head"><div class="container d-flex flex-wrap justify-content-between align-items-end gap-3">
  <div><h1>Players</h1><p>Stats for every player on the platform.</p></div>
  <button class="btn-fire" id="addBtn">Add player</button>
</div></header>

<main class="container section">
  <div class="row g-2 mb-4">
    <div class="col-md-4"><input type="search" id="search" class="form-control" placeholder="Search by IGN" aria-label="Search players"></div>
    <div class="col-md-3"><select id="roleFilter" class="form-select" aria-label="Filter by role"><option value="">All roles</option><option>IGL</option><option>Rusher</option><option>Sniper</option><option>Support</option></select></div>
  </div>
  <div class="table-wrap">
    <table class="table-ff">
      <caption class="visually-hidden">Player list</caption>
      <thead><tr><th>IGN</th><th>Real name</th><th>UID</th><th>Role</th><th>Squad</th><th>Kills</th><th>HS %</th><th></th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="pModal" tabindex="-1" aria-labelledby="pModalTitle" aria-hidden="true">
  <div class="modal-dialog"><form class="modal-content" id="pForm" novalidate>
    <div class="modal-header"><h2 class="modal-title fs-5" id="pModalTitle">Add player</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body row g-3">
      <div class="col-6"><label class="form-label" for="pIgn">In-game name</label><input class="form-control" id="pIgn" required></div>
      <div class="col-6"><label class="form-label" for="pReal">Real name</label><input class="form-control" id="pReal"></div>
      <div class="col-6"><label class="form-label" for="pUid">Free Fire UID</label><input class="form-control" id="pUid" pattern="[0-9]{6,12}" placeholder="6-12 digits"></div>
      <div class="col-6"><label class="form-label" for="pRole">Role</label><select class="form-select" id="pRole"><option>Rusher</option><option>Sniper</option><option>Support</option><option>IGL</option></select></div>
      <div class="col-12"><label class="form-label" for="pTeam">Squad</label><select class="form-select" id="pTeam" required></select></div>
      <div class="col-6"><label class="form-label" for="pKills">Kills</label><input type="number" min="0" class="form-control" id="pKills" value="0"></div>
      <div class="col-6"><label class="form-label" for="pHs">Headshot %</label><input type="number" min="0" max="100" class="form-control" id="pHs" value="0"></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn-fire" type="submit">Save player</button></div>
  </form></div>
</div>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/players.js"></script>
</body>
</html>
