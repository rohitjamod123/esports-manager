<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squads | Booyah Arena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>

<header class="page-head"><div class="container d-flex flex-wrap justify-content-between align-items-end gap-3">
  <div><h1>Squads</h1><p>Every registered squad, ranked by points.</p></div>
  <button class="btn-fire" id="addBtn">Add squad</button>
</div></header>

<main class="container section">
  <input type="search" id="search" class="form-control mb-4" style="max-width:300px" placeholder="Search squads" aria-label="Search squads">
  <div class="row g-4" id="grid"></div>
</main>

<div class="modal fade" id="teamModal" tabindex="-1" aria-labelledby="teamModalTitle" aria-hidden="true">
  <div class="modal-dialog"><form class="modal-content" id="teamForm" novalidate>
    <div class="modal-header"><h2 class="modal-title fs-5" id="teamModalTitle">Add squad</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body row g-3">
      <div class="col-8"><label class="form-label" for="fName">Squad name</label><input class="form-control" id="fName" required minlength="3"></div>
      <div class="col-4"><label class="form-label" for="fTag">Tag</label><input class="form-control" id="fTag" required maxlength="5"></div>
      <div class="col-6"><label class="form-label" for="fCaptain">Captain</label><input class="form-control" id="fCaptain" required></div>
      <div class="col-6"><label class="form-label" for="fRegion">Region</label><input class="form-control" id="fRegion" value="India"></div>
      <div class="col-6"><label class="form-label" for="fWins">Wins</label><input type="number" min="0" class="form-control" id="fWins" value="0"></div>
      <div class="col-6"><label class="form-label" for="fPoints">Points</label><input type="number" min="0" class="form-control" id="fPoints" value="0"></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn-fire" type="submit">Save squad</button></div>
  </form></div>
</div>

<div class="modal fade" id="rosterModal" tabindex="-1" aria-labelledby="rosterTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="rosterTitle">Roster</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body table-wrap"><table class="table-ff"><thead><tr><th>IGN</th><th>Role</th><th>Kills</th><th>HS %</th></tr></thead><tbody id="rosterBody"></tbody></table></div>
  </div></div>
</div>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/teams.js"></script>
</body>
</html>
