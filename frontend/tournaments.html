<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournaments | Booyah Arena</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>

<header class="page-head"><div class="container d-flex flex-wrap justify-content-between align-items-end gap-3">
  <div><h1>Tournaments</h1><p>Find an event and register your squad.</p></div>
  <button class="btn-fire" id="addBtn">Create tournament</button>
</div></header>

<main class="container section">
  <div class="d-flex flex-wrap gap-2 align-items-center mb-4">
    <div class="d-flex flex-wrap gap-1" id="filters">
      <button class="filter-btn active" data-status="All">All</button>
      <button class="filter-btn" data-status="Upcoming">Upcoming</button>
      <button class="filter-btn" data-status="Live">Live</button>
      <button class="filter-btn" data-status="Completed">Completed</button>
    </div>
    <input type="search" id="search" class="form-control ms-md-auto" style="max-width:260px" placeholder="Search by title" aria-label="Search tournaments">
  </div>
  <div class="row g-4" id="grid"></div>
</main>

<!-- Create / edit modal -->
<div class="modal fade" id="tModal" tabindex="-1" aria-labelledby="tModalTitle" aria-hidden="true">
  <div class="modal-dialog"><form class="modal-content" id="tForm" novalidate>
    <div class="modal-header"><h2 class="modal-title fs-5" id="tModalTitle">Create tournament</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body row g-3">
      <div class="col-12"><label class="form-label" for="tTitle">Title</label><input class="form-control" id="tTitle" required minlength="3"></div>
      <div class="col-6"><label class="form-label" for="tPrize">Prize pool (₹)</label><input type="number" class="form-control" id="tPrize" min="0" required></div>
      <div class="col-6"><label class="form-label" for="tSlots">Squad slots</label><input type="number" class="form-control" id="tSlots" min="2" max="64" required></div>
      <div class="col-6"><label class="form-label" for="tMode">Mode</label><select class="form-select" id="tMode"><option>Squad</option><option>Duo</option><option>Solo</option></select></div>
      <div class="col-6"><label class="form-label" for="tStatus">Status</label><select class="form-select" id="tStatus"><option>Upcoming</option><option>Live</option><option>Completed</option></select></div>
      <div class="col-12"><label class="form-label" for="tDate">Start date</label><input type="date" class="form-control" id="tDate" required></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn-fire" type="submit">Save tournament</button></div>
  </form></div>
</div>

<!-- Register modal: squad name + 4 players -->
<div class="modal fade" id="rModal" tabindex="-1" aria-labelledby="rModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" id="rForm" novalidate>
    <div class="modal-header"><div><h2 class="modal-title fs-5" id="rModalTitle">Register your squad</h2><small class="text-muted-ff" id="rTourName"></small></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div class="row g-3 mb-3">
        <div class="col-8"><label class="form-label" for="rSquad">Squad name</label><input class="form-control" id="rSquad" required minlength="3" placeholder="e.g. Desert Hawks"></div>
        <div class="col-4"><label class="form-label" for="rTag">Tag</label><input class="form-control" id="rTag" required maxlength="5" placeholder="DSH"></div>
      </div>
      <div id="playerRows"></div>
      <p class="field-hint mb-0">Player 1 is the captain. Use each player's Free Fire UID (6 to 12 digits). Registering again with the same squad name reuses your saved squad.</p>
    </div>
    <div class="modal-footer"><button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn-fire" type="submit">Register squad</button></div>
  </form></div>
</div>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/tournaments.js"></script>
</body>
</html>
